name: Run V6.6.8 Sep 2 Edge Intel Build

on:
  push:
    branches: [main]
    paths:
      - 'draft-sep2-edge-intel.json'
      - 'scripts/build-v6-6-8-sep2-edge-intel.js'
      - '.github/workflows/one-time-v6-6-8-sep2-edge-intel.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate intel JSON
        run: node -e "const x=require('./draft-sep2-edge-intel.json'); if(!x.player_overrides || Object.keys(x.player_overrides).length<10) process.exit(1); console.log(Object.keys(x.player_overrides).length+' overrides')"
      - name: Build Sep 2 edge intel update
        run: node scripts/build-v6-6-8-sep2-edge-intel.js
      - name: Validate JavaScript
        run: node --check app-v6-5.js
      - name: Validate integration
        run: |
          grep -q 'const BUILD_VERSION = "6.6.8";' app-v6-5.js
          grep -q 'draft-sep2-edge-intel.json?v=20260902-1' service-worker-v6-5.js
          grep -q '1.2.4-sep2-edge-intel' service-worker-v6-5.js
          grep -q '2026-09-02' service-worker-v6-5.js
          grep -q 'repeat(3,minmax(0,1fr))' styles-v6-5.css
      - name: Commit generated update
        run: |
          git config user.name "muzzle337"
          git config user.email "sanro4@gmail.com"
          git add app-v6-5.js index.html index-v6-5.html service-worker-v6-5.js
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "V6.6.8: ingest Sep 2 draft edge intel"
            git push
          fi
