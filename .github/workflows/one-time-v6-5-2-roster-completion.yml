name: One-time V6.5.2 roster completion fix

on:
  push:
    paths:
      - ".github/workflows/one-time-v6-5-2-roster-completion.yml"

permissions:
  contents: write

jobs:
  fix-roster-completion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add hard roster-completion guardrail
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'app-v6-5.js';
          let app = fs.readFileSync(path, 'utf8');

          app = app.replace('const BUILD_VERSION = "6.5.1-transcript-refresh";', 'const BUILD_VERSION = "6.5.2-roster-completion";');
          app = app.replace('const TEAM_COUNT = 14;', 'const TEAM_COUNT = 14;\nconst DRAFTABLE_ROSTER_SIZE = 15;');

          const anchor = `function flexNeed(state = currentState()) {\n  const assigned = assignRosterSlots(state);\n  const flex = assigned.starters.find(([label]) => label === "FLEX");\n  return flex && flex[1] ? 0 : 1;\n}\n\nfunction availablePlayers(state = currentState()) {`;

          const replacement = `function flexNeed(state = currentState()) {\n  const assigned = assignRosterSlots(state);\n  const flex = assigned.starters.find(([label]) => label === "FLEX");\n  return flex && flex[1] ? 0 : 1;\n}\n\nfunction missingRequiredStarterPositions(state = currentState()) {\n  const assigned = assignRosterSlots(state);\n  const missing = [];\n\n  for (const [label, player] of assigned.starters) {\n    if (player) continue;\n    if (label === "QB") missing.push("QB");\n    else if (label === "RB1" || label === "RB2") missing.push("RB");\n    else if (label === "WR1" || label === "WR2") missing.push("WR");\n    else if (label === "TE") missing.push("TE");\n    else if (label === "K") missing.push("K");\n    else if (label === "DEF") missing.push("DEF");\n    else if (label === "FLEX") missing.push("FLEX");\n  }\n\n  return missing;\n}\n\nfunction rosterCompletionMode(state = currentState()) {\n  const missing = missingRequiredStarterPositions(state);\n  const rostered = getRoster(state).length;\n  const slotsRemaining = Math.max(0, DRAFTABLE_ROSTER_SIZE - rostered);\n  const requiredSlotsRemaining = missing.length;\n\n  return {\n    active: requiredSlotsRemaining > 0 && slotsRemaining <= requiredSlotsRemaining,\n    missing,\n    slotsRemaining,\n    requiredSlotsRemaining\n  };\n}\n\nfunction playerCanFillMissingStarter(player, missing) {\n  if (missing.includes(player.position)) return true;\n  return missing.includes("FLEX") && ["RB", "WR", "TE"].includes(player.position);\n}\n\nfunction recommendationCandidatePool(state = currentState()) {\n  const available = availablePlayers(state);\n  const completion = rosterCompletionMode(state);\n  if (!completion.active) return available;\n  return available.filter((player) => playerCanFillMissingStarter(player, completion.missing));\n}\n\nfunction availablePlayers(state = currentState()) {`;

          if (!app.includes(anchor)) throw new Error('Could not find flexNeed/availablePlayers anchor');
          app = app.replace(anchor, replacement);

          app = app.replace(`const list = availablePlayers(state)\n    .filter((p) => matchesPosition(p,state))`, `const list = recommendationCandidatePool(state)\n    .filter((p) => matchesPosition(p,state))`);

          app = app.replace(`const recs = availablePlayers(state)\n    .map((p) => ({...p, recommendationScore: recommendationScore(p,state)}))`, `const recs = recommendationCandidatePool(state)\n    .map((p) => ({...p, recommendationScore: recommendationScore(p,state)}))`);

          app = app.replace(`const recs = availablePlayers(state)\n    .map(p => ({...p,recommendationScore:recommendationScore(p,state)}))`, `const recs = recommendationCandidatePool(state)\n    .map(p => ({...p,recommendationScore:recommendationScore(p,state)}))`);

          const contextAnchor = `el("recommendationContext").textContent = \`R\${currentRound(state)} · #\${currentOverallPick(state)}\`;`;
          const contextReplacement = `const completion = rosterCompletionMode(state);\n  el("recommendationContext").textContent = completion.active\n    ? \`COMPLETE ROSTER · \${[...new Set(completion.missing)].join(" / ")}\`\n    : \`R\${currentRound(state)} · #\${currentOverallPick(state)}\`;`;
          if (!app.includes(contextAnchor)) throw new Error('Could not find recommendation context anchor');
          app = app.replace(contextAnchor, contextReplacement);

          const reasonAnchor = `function recommendationReason(player, state = currentState()) {\n  const reasons = [];\n  const round = currentRound(state);`;
          const reasonReplacement = `function recommendationReason(player, state = currentState()) {\n  const reasons = [];\n  const round = currentRound(state);\n  const completion = rosterCompletionMode(state);\n  if (completion.active) {\n    reasons.push(\`Roster Completion Mode: only \${[...new Set(completion.missing)].join(" / ")} can fill your remaining required starter slots.\`);\n  }`;
          if (!app.includes(reasonAnchor)) throw new Error('Could not find recommendationReason anchor');
          app = app.replace(reasonAnchor, reasonReplacement);

          fs.writeFileSync(path, app);

          for (const htmlPath of ['index.html', 'index-v6-5.html']) {
            let html = fs.readFileSync(htmlPath, 'utf8');
            html = html.replace('<title>Jewel City Draft Tool V6.5.1</title>', '<title>Jewel City Draft Tool V6.5.2</title>');
            html = html.replaceAll('Draft Engine v6.5.1</button>', 'Draft Engine v6.5.2</button>');
            html = html.replace('app-v6-5.js?v=6.5.1', 'app-v6-5.js?v=6.5.2');
            fs.writeFileSync(htmlPath, html);
          }

          let sw = fs.readFileSync('service-worker-v6-5.js', 'utf8');
          sw = sw.replace('fantasy-draft-tool-v6-5-1-first-load-fix', 'fantasy-draft-tool-v6-5-2-roster-completion');
          sw = sw.replaceAll('app-v6-5.js?v=6.5.1', 'app-v6-5.js?v=6.5.2');
          fs.writeFileSync('service-worker-v6-5.js', sw);

          console.log('Roster completion guardrail installed.');
          NODE

      - name: Validate JavaScript and guardrails
        shell: bash
        run: |
          node --check app-v6-5.js
          grep -q '6.5.2-roster-completion' app-v6-5.js
          grep -q 'function rosterCompletionMode' app-v6-5.js
          grep -q 'function recommendationCandidatePool' app-v6-5.js
          grep -q 'COMPLETE ROSTER' app-v6-5.js

      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          git config user.name "muzzle337"
          git config user.email "sanro4@gmail.com"
          git rm .github/workflows/one-time-v6-5-2-roster-completion.yml
          git add app-v6-5.js index.html index-v6-5.html service-worker-v6-5.js
          git commit -m "V6.5.2: enforce roster completion recommendations"
          git push
