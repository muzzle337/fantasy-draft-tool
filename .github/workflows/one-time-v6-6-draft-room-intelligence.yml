            fs.writeFileSync(f,html);
          }

          let css = fs.readFileSync(cssPath,'utf8');
          const cssMarker='/* V6.6 Draft Room Intelligence */';
          if (!css.includes(cssMarker)) css += `\n\n${cssMarker}\n.draft-room-card{margin-bottom:14px}.compact-room-copy{margin-top:0}.draft-room-list{display:grid;gap:7px}.draft-room-team{width:100%;display:grid;grid-template-columns:minmax(82px,.8fr) minmax(0,2fr) 28px;align-items:center;gap:8px;padding:11px 12px;border:1px solid var(--border,#ddd);border-radius:12px;background:var(--card,#fff);text-align:left;color:inherit}.draft-room-team-name{font-weight:800}.draft-room-team-summary{font-size:12px;opacity:.72;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.draft-room-team-count{font-size:12px;font-weight:800;text-align:right;opacity:.65}.full-history-button{width:100%;margin-top:9px;padding:10px}.tall-modal-sheet{max-height:82vh;display:flex;flex-direction:column}.full-history-list{overflow-y:auto;display:grid;gap:7px;padding-right:2px}.full-history-row{display:grid;grid-template-columns:42px minmax(0,1fr);gap:2px 9px;padding:10px 4px;border-bottom:1px solid var(--border,#e5e5e5)}.full-history-row>span{grid-row:1/3;font-weight:800;opacity:.65}.full-history-row>strong{font-size:14px}.full-history-row>small{opacity:.65}.recent-pick-row{display:grid;grid-template-columns:78px minmax(0,1fr);gap:2px 8px;padding:8px 0;border-bottom:1px solid var(--border,#e5e5e5)}.recent-pick-row>span{grid-row:1/3;font-size:12px;opacity:.6}.recent-pick-row>strong{font-size:13px}.recent-pick-row>small{font-size:11px;opacity:.65}@media(max-width:480px){.draft-room-team{grid-template-columns:75px minmax(0,1fr) 24px;padding:10px}.draft-room-team-summary{font-size:11px}.tall-modal-sheet{max-height:88vh}}`;
          fs.writeFileSync(cssPath,css);

          let sw = fs.readFileSync(swPath,'utf8');
          sw = sw.replace(/const CACHE_NAME = "[^"]+";/,'const CACHE_NAME = "fantasy-draft-tool-v6-6-draft-room-intel";');
          sw = sw.replaceAll(/app-v6-5\.js\?v=[^"\n]+/g,'app-v6-5.js?v=6.6.0');
          sw = sw.replaceAll(/draft-brain-v6-5\.json\?v=[^"\n]+/g,'draft-brain-v6-5.json?v=6.6.0');
          sw = sw.replaceAll(/styles-v6-5\.css\?v=[^"\n]+/g,'styles-v6-5.css?v=6.6.0');
          fs.writeFileSync(swPath,sw);
          NODE

          node --check app-v6-5.js
          grep -q '6.6.0-draft-room-intel' app-v6-5.js
