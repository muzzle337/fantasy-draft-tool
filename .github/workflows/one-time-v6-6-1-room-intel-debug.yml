name: Run V6.6.1 Room Intel Debug Build
on:
  push:
    paths:
      - '.github/workflows/one-time-v6-6-1-room-intel-debug.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply transparency build
        run: node scripts/build-v6-6-1-transparency.js
      - name: Validate JavaScript
        run: node --check app-v6-5.js
      - name: Validate required UI
        run: |
          grep -q 'draftRoomDebugContent' index.html
          grep -q 'Why Now' app-v6-5.js
          grep -q 'mockWhy' app-v6-5.js
      - name: Commit build
        run: |
          git config user.name 'muzzle337'
          git config user.email 'sanro4@gmail.com'
          git add app-v6-5.js index.html index-v6-5.html styles-v6-5.css service-worker-v6-5.js
          git commit -m 'V6.6.1: expose draft room intelligence'
          git push