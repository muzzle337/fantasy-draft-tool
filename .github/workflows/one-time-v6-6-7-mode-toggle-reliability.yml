name: Run V6.6.7 Mode Toggle Reliability Build

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-v6-6-7-mode-toggle-reliability.js'
      - '.github/workflows/one-time-v6-6-7-mode-toggle-reliability.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build reliable mode toggle
        run: node scripts/build-v6-6-7-mode-toggle-reliability.js
      - name: Validate JavaScript
        run: node --check app-v6-5.js
      - name: Validate mode toggle
        run: |
          grep -q 'const BUILD_VERSION = "6.6.7";' app-v6-5.js
          grep -q "modeToggleTarget.addEventListener('pointerup'" app-v6-5.js
          grep -q "event.target.closest('button')" app-v6-5.js
          grep -q 'V6.6.7 mode toggle reliability' styles-v6-5.css
          grep -q 'repeat(3,minmax(0,1fr))' styles-v6-5.css
      - name: Commit generated update
        run: |
          git config user.name "muzzle337"
          git config user.email "sanro4@gmail.com"
          git add app-v6-5.js styles-v6-5.css index.html index-v6-5.html service-worker-v6-5.js
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "V6.6.7: make hidden mode toggle reliable"
            git push
          fi
